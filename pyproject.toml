[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-env-platform"
version = "0.1.0"
description = "A scalable, verifier-first platform for building RL agent environments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "RL Environment Contributors" }]
keywords = ["reinforcement-learning", "agents", "evaluation", "environments"]

[project.optional-dependencies]
gcp = [
  "google-cloud-pubsub>=2.39.1",
  "google-cloud-storage>=3.13.1",
]

[project.scripts]
rl-env = "rl_env.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
