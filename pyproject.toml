[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-env"
version = "0.1.0"
description = "A minimal, dependency-light reinforcement learning playground"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "gymnasium==1.2.0",
    "numpy==2.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
rl-train = "rl_env.train:main"

[tool.setuptools.packages.find]
include = ["rl_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
